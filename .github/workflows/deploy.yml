name: Build and deploy timetable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Shown as the page heading. Change to your batch name.
  TIMETABLE_TITLE: "JAEGERS TIMETABLE"
  # Only classes under this term's heading are kept (VII, 7 or 7th all work).
  # Leave it as "" to keep every term in the files.
  TIMETABLE_TERM: "VII"
  # Mess bill / attendance PDFs list several batches in one file; only rows whose
  # AFG number falls in this range are kept as "ours". Change these only if the
  # batch's AFG range ever changes (e.g. a new intake year).
  MESSBILL_AFG_MIN: "8058"
  MESSBILL_AFG_MAX: "8207"
  ATTENDANCE_AFG_MIN: "8058"
  ATTENDANCE_AFG_MAX: "8207"
  # Minimum attendance % to be considered clear, per subject and overall.
  ATTENDANCE_THEORY_MIN: "75"
  ATTENDANCE_PRACTICAL_MIN: "80"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build timetable
        run: |
          pip install pdfplumber
          mkdir -p _site
          cp index.html _site/
          if [ -f announcements.json ]; then cp announcements.json _site/; else echo "[]" > _site/announcements.json; fi
          if [ -f timetable.override.json ]; then
            echo "Using timetable.override.json instead of the PDF"
            cp timetable.override.json _site/timetable.json
          else
            python scripts/parse_timetable.py _site/timetable.json .
          fi

      - name: Build mess bill
        run: |
          if [ -f scripts/parse_messbill.py ]; then
            python scripts/parse_messbill.py _site/messbill.json .
          else
            echo "scripts/parse_messbill.py not added yet, skipping mess bill"
          fi

      - name: Build attendance
        run: |
          if [ -f scripts/parse_attendance.py ]; then
            python scripts/parse_attendance.py _site/attendance.json .
          else
            echo "scripts/parse_attendance.py not added yet, skipping attendance"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
