<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaegers Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --ink:#12211E; --muted:#56665F; --line:#D3DDDA;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --signal:#E3A008; --signal-ink:#231A00;
  --lecture:#0F6B5C; --practical:#B4531E; --other:#5A5F9E;
  --display:'Bricolage Grotesque',Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ok:#1F7A3D; --warn:#B4531E;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1513; --surface:#15211E; --ink:#E6F0ED; --muted:#93A6A0; --line:#263630;
    --accent:#4FC3AC; --accent-ink:#06211B; --signal:#F2B93B;
    --lecture:#4FC3AC; --practical:#F0894F; --other:#9AA0E8;
    --ok:#5FD087; --warn:#F0894F;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 72px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:clamp(28px,7vw,38px);font-weight:800;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}

.back{display:inline-block;margin:0 0 16px;color:var(--muted);font:600 14px Figtree,system-ui,sans-serif;text-decoration:none}
.back:hover{color:var(--ink)}

.roll{display:flex;align-items:center;gap:12px;margin:22px 0 14px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.roll:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.roll label{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.roll input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);outline:none;text-align:right;font:800 30px/1.2 var(--display);letter-spacing:-.01em}
.roll input::placeholder{color:var(--line)}

.welcome{margin:-6px 4px 18px;font:800 20px/1.2 var(--display);letter-spacing:-.01em;color:var(--accent)}

.banner{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:14px 16px;background:#FFF6E0;border:1px solid #EFD48A;border-radius:14px}
.banner .icon{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:flex;align-items:center;justify-content:center;font:800 13px var(--display)}
.banner .txt{flex:1;font-size:14px;line-height:1.4;color:#231A00}
.banner .txt b{display:block;font:700 14.5px/1.3 Figtree,sans-serif;margin-bottom:2px}
.banner button{margin-top:8px;border:1px solid var(--signal);background:transparent;color:#8a5a00;font:700 13px Figtree,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}

.announce{margin:0 0 22px;padding:12px 16px;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.announce b.lbl{display:block;font:700 12px Figtree,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.announce .note{font-size:14px}
.announce .note+.note{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.announce .note b{display:inline;font:700 13px Figtree;color:var(--ink)}
.announce .note .date{display:block;margin-top:2px;color:var(--muted);font-size:12px}

.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit}
.card .left h2{font-size:20px;font-weight:800}
.card .left p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.card .chev{color:var(--muted);font-size:20px}
.card.tt{border-left:5px solid var(--lecture)}
.card.mb{border-left:5px solid var(--practical)}
.card.at{border-left:5px solid var(--other)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--line);border-radius:12px}
.seg button{border:0;border-radius:9px;padding:10px;background:transparent;color:var(--muted);font:600 15px Figtree,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

.days{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.15;flex:0 0 auto;border:1px solid var(--line);border-radius:14px;padding:7px 14px;background:var(--surface);color:var(--ink);font:600 14px Figtree,system-ui,sans-serif;cursor:pointer}
.days button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button small{font:500 12px Figtree,system-ui,sans-serif;opacity:.8}
.days button.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.weeknote{margin:16px 2px 0;font-size:15px;color:var(--muted)}
.weeknote b{color:var(--ink);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 0}
.head h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted);font-size:14px}

.card2{--kind:var(--other);display:grid;grid-template-columns:64px 1fr;gap:14px;margin-top:10px;padding:14px 14px 14px 12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--kind);border-radius:12px}
.card2.lecture{--kind:var(--lecture)}
.card2.practical{--kind:var(--practical)}
.card2.now{outline:2px solid var(--signal);outline-offset:2px}
.t{font-variant-numeric:tabular-nums}
.t b{display:block;font:800 20px/1.1 var(--display)}
.t span{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.card2 h3{font-size:20px;font-weight:600;letter-spacing:-.005em}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.meta .kind{font-weight:600;color:var(--kind)}
.meta svg{width:13px;height:13px;margin-right:4px;vertical-align:-1px}
.flag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--signal);color:var(--signal-ink);font:600 12px Figtree,system-ui,sans-serif;vertical-align:3px}
.flag.next{background:transparent;color:var(--muted);border:1px solid var(--line)}

.slot{margin-top:20px}
.slot h3{font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.slot ul{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slot li{display:grid;grid-template-columns:92px 1fr minmax(0,38%);gap:12px;align-items:center;padding:12px 14px}
.slot li+li{border-top:1px solid var(--line)}
.slot li.mine{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.rolls{font:800 17px/1.2 var(--display);font-variant-numeric:tabular-nums}
.what b{display:block;font-weight:600}
.rolls small{display:block;margin-top:2px;font:500 12px Figtree,system-ui,sans-serif;color:var(--muted)}
.what small{display:block;color:var(--muted);font-size:13px}
.loc{color:var(--muted);font-size:14px;text-align:right}

.days button.off:not([aria-pressed=true]){color:var(--muted)}
.holiday{margin-top:12px;padding:36px 18px;text-align:center;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--signal);border-radius:12px}
.holiday h3{font:800 36px/1.1 var(--display);letter-spacing:-.02em}
.holiday p{margin:10px 0 0;color:var(--muted)}
.card2,.slot li,.holiday{transition:opacity .4s}
.card2.past,.slot li.past,.holiday.past{opacity:.5;filter:saturate(.55)}
.days button.past:not([aria-pressed=true]){opacity:.55}
.notice{margin:12px 0 0;padding:12px 14px;border-radius:10px;border:1px dashed var(--line);background:var(--surface);color:var(--muted);font-size:14px}
.calbtn{display:block;width:100%;margin-top:10px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 15px Figtree,system-ui,sans-serif;cursor:pointer}
.calmsg{min-height:1.2em;margin:6px 2px 0;font-size:13px;color:var(--muted)}
.empty{margin:28px 0;padding:22px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.empty.small{margin:8px 0;padding:12px}
.panelhead{margin:0 0 0}
.panelhead h2{font-size:28px;font-weight:800;letter-spacing:-.01em;font-family:var(--display)}
.panelhead p.sub{margin:4px 0 0}
footer{margin-top:36px;color:var(--muted);font-size:14px}
footer a{color:var(--accent)}
[hidden]{display:none!important}

/* Mess bill */
.billgroup{margin-top:20px}
.billgroup h4{margin:0 0 8px;font:700 13px Figtree,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.billtbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.billtbl td{padding:11px 14px;font-size:15px;border-top:1px solid var(--line)}
.billtbl tr:first-child td{border-top:0}
.billtbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.billtbl tr.tot td{font-weight:800;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.grandtotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding:16px;background:var(--accent);color:var(--accent-ink);border-radius:12px;font:700 16px Figtree,sans-serif}
.grandtotal b{font:800 26px var(--display)}

/* Attendance */
.atttbl{width:100%;border-collapse:collapse;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.atttbl th{text-align:left;padding:9px 10px;color:var(--muted);font:600 12px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.atttbl td{padding:10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.atttbl tr.subjhead td{padding:10px 10px 4px;border-top:1px solid var(--line);font:800 13px var(--display);color:var(--ink);text-transform:none;letter-spacing:0;background:color-mix(in srgb,var(--ink) 4%,var(--surface))}
.atttbl tr:first-child td{border-top:0}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font:700 12.5px Figtree,sans-serif;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.avgline{margin:14px 2px 0;color:var(--muted);font-size:14px}
.avgline b{color:var(--ink);font:800 18px var(--display)}
</style>
</head>
<body>
<main>

  <section id="view-home">
    <header>
      <h1>Jaegers Hub</h1>
    </header>

    <div class="roll">
      <label for="roll">Your roll no.</label>
      <input id="roll" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="27">
    </div>
    <p class="welcome" id="welcome" hidden></p>

    <div class="banner" id="messReminder" hidden>
      <div class="icon">!</div>
      <div class="txt">
        <b>Mess bill debit — 11th to 16th</b>
        Do you have the minimum balance for this month's mess bill?
        <div><button type="button" id="messReminderBtn">Yes, I've checked</button></div>
      </div>
    </div>

    <div class="announce" id="announceBox" hidden>
      <b class="lbl">Announcements</b>
      <div class="body"></div>
    </div>

    <nav class="cards">
      <a class="card tt" href="#timetable">
        <div class="left"><h2>Timetable</h2><p id="ttSub">Loading…</p></div>
        <div class="chev">›</div>
      </a>
      <a class="card mb" href="#messbill">
        <div class="left"><h2>Mess Bill</h2><p id="mbSub">Loading…</p></div>
        <div class="chev">›</div>
      </a>
      <a class="card at" href="#attendance">
        <div class="left"><h2>Attendance</h2><p id="atSub">Loading…</p></div>
        <div class="chev">›</div>
      </a>
    </nav>
  </section>

  <section id="view-timetable" hidden>
    <a class="back" href="#">← Home</a>
    <div class="panelhead">
      <h2 id="title">Timetable</h2>
      <p class="sub" id="updated"></p>
    </div>

    <div id="controls" hidden>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="mine" aria-pressed="true">My classes</button>
        <button type="button" data-view="all" aria-pressed="false">Roll-wise</button>
      </div>
      <p class="weeknote" id="weekLabel"></p>
      <nav class="days" id="days" aria-label="Day"></nav>
      <button type="button" class="calbtn" id="calBtn">Add this week to my calendar</button>
      <p class="calmsg" id="calMsg" role="status"></p>
    </div>

    <section id="out" aria-live="polite"><p class="empty">Loading timetable…</p></section>
    <footer id="foot" hidden></footer>
  </section>

  <section id="view-messbill" hidden>
    <a class="back" href="#">← Home</a>
    <div class="panelhead">
      <h2 id="mbTitle">Mess Bill</h2>
      <p class="sub" id="mbUpdated"></p>
    </div>
    <div id="mbOut"><p class="empty">Loading…</p></div>
  </section>

  <section id="view-attendance" hidden>
    <a class="back" href="#">← Home</a>
    <div class="panelhead">
      <h2 id="atTitle">Attendance</h2>
      <p class="sub" id="atUpdated"></p>
    </div>
    <div id="atOut"><p class="empty">Loading…</p></div>
  </section>

</main>

<script>
(() => {
  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  const state = { names: {}, weekStart: null, entries: [], holidays: [], roll: store.get('roll') || '', view: 'mine', day: null, pdf: null };
  let messData = null, attData = null;
  const PERSON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="5.2" r="2.6"/><path d="M2.8 14c.4-3 2.4-4.4 5.2-4.4s4.8 1.4 5.2 4.4"/></svg>';
  const PIN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 14s5-4.2 5-8a5 5 0 1 0-10 0c0 3.8 5 8 5 8z"/><circle cx="8" cy="6" r="1.7"/></svg>';

  /* ---- dates: the timetable repeats weekly; some entries (clinics) only run between two dates ---- */
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
  const dateOf = day => addDays(state.weekStart, DAYS.indexOf(day));
  /* Dates are always shown with the year, everywhere on the site. */
  const fmtDate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const rangeOf = e => e.pfrom && e.pto && e.pfrom !== e.pto ? fmtISO(e.pfrom) + ' to ' + fmtISO(e.pto) : ''; /* a posting's dates */
  const fmtISO = s => { const [y, m, dd] = s.split('-').map(Number); return fmtDate(new Date(y, m - 1, dd)); };
  const DOW = d => DAYS[(d.getDay() + 6) % 7];
  /* Compact "21–27 Sep 2026" style range for the Home screen cards: one year shown once. */
  function fmtRangeCompact(start, end){
    const dayMon = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    if (start.getFullYear() === end.getFullYear()){
      if (start.getMonth() === end.getMonth()) return `${start.getDate()}–${end.getDate()} ${end.toLocaleDateString('en-GB',{month:'short'})} ${end.getFullYear()}`;
      return `${dayMon(start)} – ${dayMon(end)} ${end.getFullYear()}`;
    }
    return `${fmtDate(start)} – ${fmtDate(end)}`;
  }
  /* Does a timetable entry run on this date? Entries can be limited to a week or date range (from/to),
     to exact dates (on), to days of the month (dom, mon), and can skip dates. day "*" means any weekday. */
  function applies(e, d){
    const k = iso(d);
    if (e.from && k < e.from) return false;
    if (e.to && k > e.to) return false;
    if (e.on && !e.on.includes(k)) return false;
    if (e.dom && !e.dom.includes(d.getDate())) return false;
    if (e.mon && !e.mon.includes(d.getMonth() + 1)) return false;
    if (e.nth && !e.nth.includes(Math.floor((d.getDate() - 1) / 7) + 1)) return false; /* 1st, 2nd... occurrence of this weekday in the month */
    if (e.skip && e.skip.includes(k)) return false;
    return e.day === '*' || e.day === DOW(d);
  }
  const entriesOn = day => { const d = dateOf(day); return state.entries.filter(e => applies(e, d)).sort(byTime); };
  /* Has a timetable been uploaded for the shown week? The clinics rotation (rot) doesn't count. */
  const weekCovered = () => DAYS.some(day => { const d = dateOf(day); return state.entries.some(e => !e.rot && applies(e, d)); });
  const holidayFor = (day, d) => state.holidays.find(h => h.date === iso(d)) || state.holidays.find(h => !h.date && h.day === day);

  /* Does a roll spec from the PDF ("1-25", "All", "1-20, 41, 45") include this roll? */
  function rollMatches(spec, roll){
    spec = String(spec || '').trim();
    if (!spec || /\b(all|everyone|entire|whole)\b/i.test(spec)) return true;
    if (!/\d/.test(spec)) return true; /* batch name we couldn't turn into roll numbers: show it rather than hide it */
    const n = parseInt((String(roll).match(/(\d+)\D*$/) || [])[1], 10);
    if (Number.isNaN(n)) return false;
    const range = /(\d+)\s*(?:-|–|—|to)\s*(\d+)/gi;
    const open = /(\d+)\s*(?:\+|onwards?|and\s+above)/gi;
    let m;
    while ((m = range.exec(spec))) if (n >= +m[1] && n <= +m[2]) return true;
    while ((m = open.exec(spec))) if (n >= +m[1]) return true;
    const rest = spec.replace(/(\d+)\s*(?:-|–|—|to)\s*(\d+)/gi, ' ').replace(/(\d+)\s*(?:\+|onwards?|and\s+above)/gi, ' ')
                     .replace(/\b(roll|rolls|no|nos|number|numbers)\b\.?/gi, ' ');
    if (!/[a-z]/i.test(rest)) return (rest.match(/\d+/g) || []).some(x => +x === n);
    return false;
  }
  /* The trailing digits of whatever roll no. was typed, as a plain number - used to look students
     up in the mess bill / attendance data, which are keyed by roll. */
  const rollNum = () => parseInt((String(state.roll).match(/(\d+)\D*$/) || [])[1], 10);

  /* "9:00", "09.00 AM", "1:30 pm" → minutes since midnight. Bare hours under 7 are read as afternoon. */
  function clock(part){
    const m = /(\d{1,2})(?:[:.](\d{2}))?\s*([ap]m?)?/i.exec(part || '');
    if (!m) return null;
    let h = +m[1]; const mi = +(m[2] || 0); const ap = (m[3] || '')[0]?.toLowerCase();
    if (ap === 'p' && h < 12) h += 12;
    if (ap === 'a' && h === 12) h = 0;
    if (!ap && h < 7) h += 12;
    return h * 60 + mi;
  }
  function span(time){
    const parts = String(time || '').split(/\s*[-–—]\s*|\s+to\s+/i).map(x => x.trim());
    const s = clock(parts[0]);
    let e = parts[1] != null ? clock(parts[1]) : null;
    if (s != null && e != null && e <= s) e += 720;
    return { s, e, parts };
  }
  const byTime = (a, b) => (a._s ?? 1e9) - (b._s ?? 1e9);
  const kindOf = c => /lect|theor/i.test(c) ? 'lecture' : /prac|lab|clinic|dissect|skill/i.test(c) ? 'practical' : '';
  const fmtRolls = s => String(s || 'All').replace(/\s*-\s*/g, '–').replace(/(\d+)\s*\+/g, '$1+');
  const hasNums = r => /\d/.test(String(r || ''));
  /* "Batch B, Roll 51–100"; a batch name we couldn't convert shows as "Batch A" */
  function rollLabel(e){
    const r = String(e.rolls || 'All').trim();
    if (!hasNums(r) && !/^all/i.test(r)) return /^(batch|group)/i.test(r) ? r : 'Batch ' + r;
    return (e.batch ? 'Batch ' + e.batch + ', ' : '') + 'Roll ' + fmtRolls(r).replace(/(\d+)\+/g, '$1 onwards');
  }

  const todayName = () => new Date().toLocaleDateString('en-US', { weekday: 'long' });
  /* Mon to Sat always, plus Sunday when it appears in the timetable, is marked, or is today (inside the shown week) */
  function visibleDays(){
    const todayISO = iso(new Date());
    return DAYS.filter((d, i) => i < 6 || iso(dateOf(d)) === todayISO || state.holidays.some(h => h.day === d) || state.entries.some(e => e.day === d));
  }
  function holidayView(day, isToday, isPast){
    const h = holidayFor(day, dateOf(day));
    const note = h && h.note;
    return `<div class="head"><h2>${day}</h2><p>${fmtDate(dateOf(day))}</p></div>
      <div class="holiday${isPast ? ' past' : ''}"><h3>Holiday</h3><p>${esc(note || (isToday ? 'No classes today.' : 'No classes on ' + day + '.'))}</p></div>`;
  }

  function renderDays(){
    const days = visibleDays();
    const todayISO = iso(new Date());
    $('#days').innerHTML = days.map(d =>
      `<button type="button" data-day="${d}" aria-pressed="${d === state.day}" class="${[iso(dateOf(d)) === todayISO ? 'today' : '', iso(dateOf(d)) < todayISO ? 'past' : '', entriesOn(d).length ? '' : 'off'].join(' ').trim()}"><span>${d.slice(0,3)}</span><small>${dateOf(d).getDate()}</small></button>`
    ).join('');
    $('#days [aria-pressed=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function renderOut(){
    const out = $('#out');
    const day = state.day;
    if (!day) return;
    const dayEntries = entriesOn(day);
    const now = new Date();
    const date = dateOf(day);
    const isToday = iso(date) === iso(now);
    const isPastDay = iso(date) < iso(now);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const covered = weekCovered();
    const notice = covered ? '' : `<p class="notice">No timetable has been uploaded for this week yet.${dayEntries.length ? ' You are only seeing the clinics rotation.' : ''}</p>`;
    /* A class is over once its end time has passed (start + 1 hour if no end time); a whole day once it is behind us. */
    const isOver = e => isPastDay || (isToday && (e._e != null ? nowMin >= e._e : e._s != null && nowMin >= e._s + 60));

    if (!dayEntries.length){
      if (!covered && !holidayFor(day, date)){
        out.innerHTML = `<div class="head"><h2>${day}</h2><p>${fmtDate(date)}</p></div>` + notice; return;
      }
      out.innerHTML = holidayView(day, isToday, isPastDay); return;
    }

    if (state.view === 'mine'){
      if (!state.roll){ out.innerHTML = notice + '<p class="empty">Type your roll no. on the Home screen to see your classes.</p>'; return; }
      const mine = dayEntries.filter(e => rollMatches(e.rolls, state.roll));
      const head = `<div class="head"><h2>${day}</h2><p>${fmtDate(date)}, ${mine.length} ${mine.length === 1 ? 'class' : 'classes'}</p></div>` + notice;
      if (!mine.length){ out.innerHTML = head + `<p class="empty">Nothing on ${day} for roll ${esc(state.roll)}.</p>`; return; }
      const live = e => !isOver(e);
      const nowIdx = isToday ? mine.findIndex(e => e._s != null && e._e != null && nowMin >= e._s && nowMin < e._e) : -1;
      const nextIdx = isToday && nowIdx < 0 ? mine.findIndex(e => e._s != null && e._s > nowMin) : -1;
      out.innerHTML = head + mine.map((e, i) => {
        const [a, b] = e.parts;
        const flag = i === nowIdx ? '<span class="flag">Now</span>' : i === nextIdx ? '<span class="flag next">Next</span>' : '';
        return `<article class="card2 ${kindOf(e.class)}${i === nowIdx ? ' now' : ''}${live(e) ? '' : ' past'}">
          <div class="t"><b>${esc(a)}</b>${b ? `<span>${esc(b)}</span>` : ''}</div>
          <div>
            <h3>${esc(e.subject)}${flag}</h3>
            <p class="meta">
              ${e.class ? `<span class="kind">${esc(e.class)}</span>` : ''}
              ${e.faculty ? `<span>${PERSON}${esc(e.faculty)}</span>` : ''}
              ${e.location ? `<span>${PIN}${esc(e.location)}</span>` : ''}
              <span>${esc(rollLabel(e))}</span>
              ${rangeOf(e) ? `<span>${esc(rangeOf(e))}</span>` : ''}
            </p>
          </div>
        </article>`;
      }).join('');
      return;
    }

    /* Roll-wise: everyone's split for the day, grouped by time slot, your row highlighted */
    const head = `<div class="head"><h2>${day}</h2><p>${fmtDate(date)}, who goes where</p></div>` + notice;
    const slots = new Map();
    dayEntries.forEach(e => { const k = e.time; (slots.get(k) || slots.set(k, []).get(k)).push(e); });
    out.innerHTML = head + [...slots].map(([time, list]) => {
      const p = list[0].parts;
      return `<div class="slot"><h3>${esc(p.join(' – '))}</h3><ul>` + list.map(e =>
        `<li class="${[state.roll && rollMatches(e.rolls, state.roll) ? 'mine' : '', isOver(e) ? 'past' : ''].join(' ').trim()}">
          <span class="rolls">${esc(hasNums(e.rolls) || /^all/i.test(e.rolls || 'All') ? fmtRolls(e.rolls) : rollLabel(e))}${e.batch ? `<small>Batch ${esc(e.batch)}</small>` : ''}</span>
          <span class="what"><b>${esc(e.subject)}</b>${e.class ? `<small>${esc(e.class)}</small>` : ''}${e.faculty ? `<small>${esc(e.faculty)}</small>` : ''}${rangeOf(e) ? `<small>${esc(rangeOf(e))}</small>` : ''}</span>
          <span class="loc">${esc(e.location)}</span>
        </li>`).join('') + '</ul></div>';
    }).join('');
  }

  /* ---- add the shown week to the phone calendar (.ics) ---- */
  const icsText = t => String(t ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = line => (line.match(/[\s\S]{1,60}/gu) || ['']).join('\r\n ');
  const hhmmss = m => pad(Math.floor(m / 60)) + pad(m % 60) + '00';
  function buildICS(){
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Batch timetable//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
                   'X-WR-CALNAME:' + icsText(document.title)];
    let count = 0;
    for (const day of DAYS){
      const d = dateOf(day), ymd = iso(d).replace(/-/g, '');
      for (const e of entriesOn(day)){
        if (!rollMatches(e.rolls, state.roll)) continue;
        const when = e._s == null
          ? ['DTSTART;VALUE=DATE:' + ymd, 'DTEND;VALUE=DATE:' + iso(addDays(d, 1)).replace(/-/g, '')]
          : ['DTSTART:' + ymd + 'T' + hhmmss(e._s), 'DTEND:' + ymd + 'T' + hhmmss(Math.min(e._e != null ? e._e : e._s + 60, 1439))];
        const desc = [e.faculty, rollLabel(e), rangeOf(e) && 'Posting dates: ' + rangeOf(e)].filter(Boolean).join('\n');
        lines.push('BEGIN:VEVENT', 'UID:' + ymd + '-' + (e._s ?? 'x') + '-' + (count++) + '-' + String(state.roll).replace(/\W/g, '') + '@batch-timetable',
                   'DTSTAMP:' + stamp, ...when,
                   'SUMMARY:' + icsText(e.subject + (e.class ? ': ' + e.class : '')),
                   ...(e.location ? ['LOCATION:' + icsText(e.location)] : []),
                   ...(desc ? ['DESCRIPTION:' + icsText(desc)] : []), 'END:VEVENT');
      }
    }
    lines.push('END:VCALENDAR');
    return { text: lines.map(fold).join('\r\n') + '\r\n', count };
  }
  function addToCalendar(){
    const msg = t => { $('#calMsg').textContent = t; };
    if (!state.roll){ msg('Type your roll no. on the Home screen first.'); return; }
    const { text, count } = buildICS();
    if (!count){ msg('There are no classes to add in this week.'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' }));
    a.download = 'classes-' + iso(state.weekStart) + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    msg(count + (count === 1 ? ' class' : ' classes') + ' for ' + fmtDate(state.weekStart) + ' to ' + fmtDate(addDays(state.weekStart, 6)) + ' saved. Open the file to add them to your calendar.');
  }

  function renderWelcome(){
    const el = $('#welcome');
    const n = rollNum();
    const name = Number.isNaN(n) ? '' : (state.names[String(n)] || '');
    el.hidden = !name;
    el.textContent = name ? 'Welcome, ' + name : '';
  }

  function renderWeek(){
    $('#calMsg').textContent = '';
    const start = state.weekStart, end = addDays(start, 6);
    $('#weekLabel').innerHTML = `Timetable for <b>${fmtDate(start)} – ${fmtDate(end)}</b>`;
    $('#ttSub').textContent = fmtRangeCompact(start, end);
    renderDays(); renderOut();
  }

  function initTimetable(d){
    state.entries = (d.entries || []).map(e => { const sp = span(e.time); return { ...e, _s: sp.s, _e: sp.e, parts: sp.parts }; });
    state.pdf = d.pdf || null;
    state.names = d.names || {};
    if (d.title){ $('#title').textContent = d.title; document.title = d.title; }
    if (d.updated){
      const dt = new Date(d.updated);
      if (!isNaN(dt)) $('#updated').textContent = 'Updated ' + fmtDate(dt);
    }
    state.holidays = (d.holidays || []).filter(h => h && h.day);
    if (!state.entries.length && !state.holidays.length){ $('#out').innerHTML = '<p class="empty">The timetable has no classes yet.</p>'; $('#ttSub').textContent = 'Nothing uploaded yet'; return; }
    /* One week only: the week the timetable was published for. It changes only when a newer week is uploaded. */
    const w = d.week && d.week.from ? d.week.from.split('-').map(Number) : null;
    state.weekStart = w ? new Date(w[0], w[1] - 1, w[2]) : mondayOf(new Date());
    const todayISO = iso(new Date());
    state.day = todayISO >= iso(state.weekStart) && todayISO <= iso(addDays(state.weekStart, 6)) ? todayName() : 'Monday';
    $('#controls').hidden = false;
    if (state.pdf){ $('#foot').hidden = false; $('#foot').innerHTML = `<a href="${esc(state.pdf)}">Open the original PDF</a>`; }
    renderWelcome(); renderWeek();
    setInterval(renderOut, 60000);
  }

  /* ---- Mess Bill ---- */
  function renderMessBill(){
    const el = $('#mbOut');
    if (!messData){ el.innerHTML = '<p class="empty">Couldn’t load the mess bill.</p>'; return; }
    const n = rollNum();
    if (Number.isNaN(n)){ el.innerHTML = '<p class="empty">Type your roll no. on the Home screen to see your bill.</p>'; return; }
    const s = messData.students[String(n)];
    if (!s){ el.innerHTML = `<p class="empty">No mess bill found for roll ${esc(state.roll)}.</p>`; return; }
    const rows = list => list.map(x => `<tr><td>${esc(x.label)}</td><td>₹${x.amount.toLocaleString('en-IN')}</td></tr>`).join('');
    el.innerHTML = `
      <h3>${esc(s.name)}</h3>
      <div class="billgroup">
        <h4>Normal Charges</h4>
        <table class="billtbl">${rows(s.normal)}<tr class="tot"><td>Total</td><td>₹${s.normal_total.toLocaleString('en-IN')}</td></tr></table>
      </div>
      <div class="billgroup">
        <h4>Additional Charges</h4>
        ${s.additional.length ? `<table class="billtbl">${rows(s.additional)}<tr class="tot"><td>Total</td><td>₹${s.additional_total.toLocaleString('en-IN')}</td></tr></table>` : '<p class="empty small">No additional charges.</p>'}
      </div>
      <div class="grandtotal"><span>Grand Total</span><b>₹${s.total.toLocaleString('en-IN')}</b></div>`;
  }

  /* ---- Attendance ---- */
  /* Classes still needed to reach a target %, assuming every future class held is attended:
     x ≥ (minPct·held − 100·attd) / (100−minPct). Kept in whole-number arithmetic throughout
     (never minPct/100 as a float) so an exact result like 59.0 can't drift to 59.000000007
     and get rounded up to 60 by floating-point noise. */
  function moreNeeded(attd, held, minPct){
    if (!held || attd * 100 >= minPct * held) return 0;
    const num = minPct * held - 100 * attd;
    const den = 100 - minPct;
    return Math.max(0, Math.ceil(num / den));
  }
  function attRow(label, block, minPct){
    if (!block) return '';
    const ok = block.pct >= minPct;
    const need = ok ? 0 : moreNeeded(block.attd, block.held, minPct);
    return `<tr><td>${esc(label)}</td><td>${block.held}</td><td>${block.attd}</td><td>${block.pct}%</td>
      <td><span class="badge ${ok ? 'ok' : 'warn'}">${ok ? '✓ Clear' : '→ ' + need + ' more'}</span></td></tr>`;
  }
  function renderAttendance(){
    const el = $('#atOut');
    if (!attData){ el.innerHTML = '<p class="empty">Couldn’t load attendance.</p>'; return; }
    const n = rollNum();
    if (Number.isNaN(n)){ el.innerHTML = '<p class="empty">Type your roll no. on the Home screen to see your attendance.</p>'; return; }
    const s = attData.students[String(n)];
    if (!s){ el.innerHTML = `<p class="empty">No attendance found for roll ${esc(state.roll)}.</p>`; return; }
    const tMin = attData.theory_min_pct, pMin = attData.practical_min_pct;
    let rows = '';
    for (const name of attData.subjects){
      const sub = s.subjects[name];
      if (!sub) continue;
      rows += `<tr class="subjhead"><td colspan="5">${esc(name)}</td></tr>`;
      rows += attRow('Theory', sub.theory, tMin);
      rows += attRow('Practical', sub.practical, pMin);
    }
    rows += `<tr class="subjhead"><td colspan="5">Overall</td></tr>`;
    rows += attRow('Theory', s.total_theory, tMin);
    rows += attRow('Practical', s.total_practical, pMin);
    el.innerHTML = `
      <h3>${esc(s.name)}</h3>
      <table class="atttbl">
        <thead><tr><th></th><th>Held</th><th>Attd</th><th>%</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="avgline">Average <b>${s.avg_pct}%</b> · theory min ${tMin}%, practical min ${pMin}%</p>`;
  }

  /* ---- Home: mess bill reminder banner (shows 11th–16th of the month, dismissible for that month) ---- */
  const BANK_HOLIDAYS = []; /* add "YYYY-MM-DD" entries here later to also skip those dates */
  function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  function renderReminder(){
    const el = $('#messReminder');
    const now = new Date();
    const day = now.getDate();
    const inWindow = day >= 11 && day <= 16 && !BANK_HOLIDAYS.includes(iso(now));
    if (!inWindow){ el.hidden = true; return; }
    const key = 'messReminderDismissed_' + (state.roll || 'anon');
    el.hidden = store.get(key) === monthKey(now);
  }
  $('#messReminderBtn').addEventListener('click', () => {
    store.set('messReminderDismissed_' + (state.roll || 'anon'), monthKey(new Date()));
    $('#messReminder').hidden = true;
  });

  /* ---- Home: announcements (hand-edited announcements.json; hidden entirely if absent/empty) ---- */
  function renderAnnouncements(list){
    const el = $('#announceBox');
    if (!Array.isArray(list) || !list.length){ el.hidden = true; return; }
    el.hidden = false;
    el.querySelector('.body').innerHTML = list.map(a =>
      `<div class="note">${a.title ? `<b>${esc(a.title)}</b> — ` : ''}${esc(a.text || '')}${a.date ? `<span class="date">${esc(a.date)}</span>` : ''}</div>`
    ).join('');
  }

  /* ---- roll input: shared across Home + all three sections ---- */
  $('#roll').value = state.roll;
  $('#roll').addEventListener('input', e => {
    state.roll = e.target.value.trim();
    store.set('roll', state.roll);
    $('#calMsg').textContent = '';
    renderWelcome(); renderReminder(); renderOut(); renderMessBill(); renderAttendance();
  });
  document.querySelector('.seg')?.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.view;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderOut();
  });
  $('#calBtn').addEventListener('click', addToCalendar);
  $('#days').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.day = b.dataset.day; renderDays(); renderOut();
  });

  /* ---- routing: Home + three sections, switched by URL hash, nothing ever reloads ---- */
  const VIEWS = ['home', 'timetable', 'messbill', 'attendance'];
  function route(){
    const hash = location.hash.replace('#', '');
    const view = VIEWS.includes(hash) ? hash : 'home';
    for (const v of VIEWS) $('#view-' + v).hidden = v !== view;
    if (view === 'timetable') { renderDays(); renderOut(); }
    if (view === 'home') renderReminder();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();

  renderWelcome();

  fetch('timetable.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(initTimetable)
    .catch(() => { $('#out').innerHTML = '<p class="empty">Couldn’t load the timetable. If you opened this file directly, serve it with GitHub Pages or a local server.</p>'; $('#ttSub').textContent = 'Unavailable'; });

  fetch('messbill.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      messData = d;
      $('#mbTitle').textContent = d.title || 'Mess Bill';
      $('#mbSub').textContent = d.month || '';
      $('#mbUpdated').textContent = d.updated ? 'Updated ' + fmtDate(new Date(d.updated)) : '';
      renderReminder(); renderMessBill();
    })
    .catch(() => { $('#mbSub').textContent = 'Not uploaded yet'; $('#mbOut').innerHTML = '<p class="empty">Mess bill hasn’t been uploaded yet.</p>'; });

  fetch('attendance.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      attData = d;
      $('#atTitle').textContent = d.title || 'Attendance';
      $('#atSub').textContent = d.as_of ? 'Till ' + d.as_of : '';
      $('#atUpdated').textContent = [d.term, d.updated ? 'updated ' + fmtDate(new Date(d.updated)) : ''].filter(Boolean).join(' · ');
      renderAttendance();
    })
    .catch(() => { $('#atSub').textContent = 'Not uploaded yet'; $('#atOut').innerHTML = '<p class="empty">Attendance hasn’t been uploaded yet.</p>'; });

  fetch('announcements.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : [])
    .then(renderAnnouncements)
    .catch(() => {});
})();
</script>
</body>
</html>
